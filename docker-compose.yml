version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: governanca
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: ./server
    depends_on:
      - db
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: governanca
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8080:8080"
volumes:
  dbdata:
