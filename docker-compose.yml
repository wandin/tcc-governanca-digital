services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: governanca
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: governanca
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  dbdata:
